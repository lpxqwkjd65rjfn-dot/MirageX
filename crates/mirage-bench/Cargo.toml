[package]
name = "mirage-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MirageX — throughput + latency micro-benchmarks. Spawns an in-process echo server, dials it through the MirageX engine, and prints MB/s + p50/p95/p99 latency."
publish = false

[[bin]]
name = "mirage-bench"
path = "src/main.rs"

[dependencies]
