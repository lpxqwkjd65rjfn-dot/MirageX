[workspace]
resolver = "2"
members = [
    "crates/mirage-core",
    "crates/mirage-config",
    "crates/mirage-proto-vless",
    "crates/mirage-tls-reality",
    "crates/mirage-transport-raw",
    "crates/mirage-transport-xhttp",
    "crates/mirage-vision",
    "crates/mirage-mobile",
    "crates/mirage-engine",
    "crates/mirage-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/lpxqwkjd65rjfn-dot/MirageX"
authors = ["MirageX Contributors"]

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"

# Networking / TLS
bytes = "1.7"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
h2 = "0.4"
http = "1.1"
http-body-util = "0.1"

# Cryptography
ring = "0.17"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
rand_chacha = "0.3"

# Encoding / Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
hex = "0.4"
base64 = "0.22"

# CLI / Logging
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Errors / Misc
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.20"
parking_lot = "0.12"
ahash = "0.8"

# Internal crates (referenced by version+path)
mirage-core = { path = "crates/mirage-core", version = "0.1.0" }
mirage-config = { path = "crates/mirage-config", version = "0.1.0" }
mirage-proto-vless = { path = "crates/mirage-proto-vless", version = "0.1.0" }
mirage-tls-reality = { path = "crates/mirage-tls-reality", version = "0.1.0" }
mirage-transport-raw = { path = "crates/mirage-transport-raw", version = "0.1.0" }
mirage-transport-xhttp = { path = "crates/mirage-transport-xhttp", version = "0.1.0" }
mirage-vision = { path = "crates/mirage-vision", version = "0.1.0" }
mirage-mobile = { path = "crates/mirage-mobile", version = "0.1.0" }
mirage-engine = { path = "crates/mirage-engine", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.bench]
inherits = "release"
debug = true
strip = "none"
lto = "thin"
